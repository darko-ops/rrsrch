[project]
name = "rrsrch"
version = "0.1.0"
description = "The evidence engine for regenerative medicine: claims traced to source passages, checked by rule."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
rrsrch = "rrsrch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrsrch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # also works when macOS hides the editable-install .pth (Python 3.13 skips hidden .pth files)
markers = ["network: hits Europe PMC / ClinicalTrials.gov (deselect with -m 'not network')", "db: needs the Postgres from docker-compose"]
